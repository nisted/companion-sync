name: Build Rebel Sync

on:
  push:
    paths-ignore:
      - '**.md'        # roadmap / readme edits don't need a new build
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow cryptography
      - name: Get rclone
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rc.zip
          Expand-Archive rc.zip -DestinationPath rc
          Copy-Item (Get-ChildItem rc -Recurse -Filter rclone.exe).FullName .
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name "Rebel Sync" --icon icon.png --hidden-import pystray._win32 --hidden-import web --hidden-import popup --add-binary "rclone.exe;." --add-data "logo-source.png;." app.py
      - name: Installer
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(256,256)])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Get-Content VERSION).Trim()
          & $iscc "/DBuild=${{ github.run_number }}" "/DVersion=$ver" build\rebel-sync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Rebel-Sync-Windows
          path: |
            dist/Rebel Sync.exe
            dist/Rebel-Sync-Setup.exe

  mac:
    runs-on: macos-latest          # Apple silicon Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow cryptography
      - name: Get rclone
        run: |
          curl -sSL -o rc.zip https://downloads.rclone.org/rclone-current-osx-arm64.zip
          unzip -q rc.zip && cp rclone-*/rclone . && chmod +x rclone
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "Rebel Sync" --icon icon.png \
            --osx-bundle-identifier uk.co.nigelisted.rebelsync \
            --hidden-import pystray._darwin --hidden-import web --hidden-import popup --add-binary "rclone:." --add-data "logo-source.png:." app.py
          # menu-bar only: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "dist/Rebel Sync.app/Contents/Info.plist"
          plist="dist/Rebel Sync.app/Contents/Info.plist"
          for kv in "CFBundleShortVersionString $(cat VERSION)" "CFBundleVersion ${{ github.run_number }}"; do
            set -- $kv
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist"
          done
          codesign --force --deep -s - "dist/Rebel Sync.app"
          ditto -c -k --keepParent "dist/Rebel Sync.app" Rebel-Sync-Mac.zip
          # for Macs still on Companion Sync: their updater looks for "Companion Sync.app";
          # the new app renames itself to Rebel Sync.app when it first opens
          mkdir legacy && ditto "dist/Rebel Sync.app" "legacy/Companion Sync.app"
          ditto -c -k --keepParent "legacy/Companion Sync.app" Companion-Sync-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rebel-Sync-Mac
          path: |
            Rebel-Sync-Mac.zip
            Companion-Sync-Mac.zip

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests (folder, rclone as for Google Drive, GitHub); a failure stops the release
        run: |
          pip install cryptography
          curl -fsSL https://rclone.org/install.sh | sudo bash
          python tests/test_engine.py
      - name: Google sign-in details
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python3 build/write_client.py
      - name: Package for the Pi
        run: |
          mkdir -p pkg/rebel-sync
          cp -r engine.py app.py web.py popup.py icon.py trayfix.py rebeldeck_link.py logo-source.png _client.py VERSION panel pi pkg/rebel-sync/
          echo "${{ github.run_number }}" > pkg/rebel-sync/BUILD
          find pkg -name __pycache__ -prune -exec rm -rf {} +
          tar czf Rebel-Sync-Pi.tar.gz -C pkg rebel-sync
          # for Pis still on Companion Sync: their updater unpacks "companion-sync/pi/install.sh"
          mkdir legacy && cp -r pkg/rebel-sync legacy/companion-sync
          tar czf Companion-Sync-Pi.tar.gz -C legacy companion-sync
      - uses: actions/upload-artifact@v4
        with:
          name: Rebel-Sync-Pi
          path: |
            Rebel-Sync-Pi.tar.gz
            Companion-Sync-Pi.tar.gz

  # Publish each build from main as the latest release: the app's
  # "Update Rebel Sync" menu item downloads and installs it from here. The
  # Companion-Sync-* copies let rigs still on Companion Sync update to it.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, mac, pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/Rebel-Sync-Windows/Rebel Sync.exe" Rebel-Sync-Windows.exe
          cp out/Rebel-Sync-Windows/Rebel-Sync-Setup.exe Rebel-Sync-Setup.exe
          cp out/Rebel-Sync-Windows/Rebel-Sync-Setup.exe Companion-Sync-Setup.exe
          cp out/Rebel-Sync-Mac/Rebel-Sync-Mac.zip out/Rebel-Sync-Mac/Companion-Sync-Mac.zip .
          cp out/Rebel-Sync-Pi/Rebel-Sync-Pi.tar.gz out/Rebel-Sync-Pi/Companion-Sync-Pi.tar.gz .
          gh release create "build-${{ github.run_number }}" \
            Rebel-Sync-Setup.exe Rebel-Sync-Windows.exe Rebel-Sync-Mac.zip Rebel-Sync-Pi.tar.gz \
            Companion-Sync-Setup.exe Companion-Sync-Mac.zip Companion-Sync-Pi.tar.gz \
            --repo "${{ github.repository }}" --latest \
            --title "Rebel Sync v$(cat VERSION) (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Companion Sync is now Rebel Sync: the Companion-Sync-* files are for rigs updating from Companion Sync."
