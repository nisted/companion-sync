name: Build Companion Sync

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow
      - name: Get rclone
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rc.zip
          Expand-Archive rc.zip -DestinationPath rc
          Copy-Item (Get-ChildItem rc -Recurse -Filter rclone.exe).FullName .
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name "Companion Sync" --icon icon.png --hidden-import pystray._win32 --add-binary "rclone.exe;." --add-data "logo-source.png;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-Sync-Windows
          path: dist/Companion Sync.exe

  mac:
    runs-on: macos-latest          # Apple silicon Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow
      - name: Get rclone
        run: |
          curl -sSL -o rc.zip https://downloads.rclone.org/rclone-current-osx-arm64.zip
          unzip -q rc.zip && cp rclone-*/rclone . && chmod +x rclone
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "Companion Sync" --icon icon.png \
            --osx-bundle-identifier uk.co.nigelisted.companionsync \
            --hidden-import pystray._darwin --add-binary "rclone:." --add-data "logo-source.png:." app.py
          # menu-bar only: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "dist/Companion Sync.app/Contents/Info.plist"
          codesign --force --deep -s - "dist/Companion Sync.app"
          ditto -c -k --keepParent "dist/Companion Sync.app" Companion-Sync-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-Sync-Mac
          path: Companion-Sync-Mac.zip

  # Publish each build from main as the latest release, so the app's
  # "Update Companion Sync" menu item can link straight to the download.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/Companion-Sync-Windows/Companion Sync.exe" Companion-Sync-Windows.exe
          cp out/Companion-Sync-Mac/Companion-Sync-Mac.zip Companion-Sync-Mac.zip
          gh release create "build-${{ github.run_number }}" \
            Companion-Sync-Windows.exe Companion-Sync-Mac.zip \
            --repo "${{ github.repository }}" --latest \
            --title "Companion Sync build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
