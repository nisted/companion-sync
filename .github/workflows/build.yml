name: Build Companion Sync

on:
  push:
    paths-ignore:
      - '**.md'        # roadmap / readme edits don't need a new build
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow cryptography
      - name: Get rclone
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rc.zip
          Expand-Archive rc.zip -DestinationPath rc
          Copy-Item (Get-ChildItem rc -Recurse -Filter rclone.exe).FullName .
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name "Companion Sync" --icon icon.png --hidden-import pystray._win32 --hidden-import web --hidden-import popup --add-binary "rclone.exe;." --add-data "logo-source.png;." app.py
      - name: Installer
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(256,256)])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Get-Content VERSION).Trim()
          & $iscc "/DBuild=${{ github.run_number }}" "/DVersion=$ver" build\companion-sync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-Sync-Windows
          path: |
            dist/Companion Sync.exe
            dist/Companion-Sync-Setup.exe

  mac:
    runs-on: macos-latest          # Apple silicon Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow cryptography
      - name: Get rclone
        run: |
          curl -sSL -o rc.zip https://downloads.rclone.org/rclone-current-osx-arm64.zip
          unzip -q rc.zip && cp rclone-*/rclone . && chmod +x rclone
      - name: Sign-in details and icon
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python build/write_client.py
          python icon.py
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name "Companion Sync" --icon icon.png \
            --osx-bundle-identifier uk.co.nigelisted.companionsync \
            --hidden-import pystray._darwin --hidden-import web --hidden-import popup --add-binary "rclone:." --add-data "logo-source.png:." app.py
          # menu-bar only: no Dock icon
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "dist/Companion Sync.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(cat VERSION)" "dist/Companion Sync.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "dist/Companion Sync.app/Contents/Info.plist"
          codesign --force --deep -s - "dist/Companion Sync.app"
          ditto -c -k --keepParent "dist/Companion Sync.app" Companion-Sync-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-Sync-Mac
          path: Companion-Sync-Mac.zip

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Google sign-in details
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python3 build/write_client.py
      - name: Package for the Pi
        run: |
          mkdir -p pkg/companion-sync
          cp -r engine.py app.py web.py popup.py icon.py logo-source.png _client.py VERSION panel pi pkg/companion-sync/
          echo "${{ github.run_number }}" > pkg/companion-sync/BUILD
          find pkg -name __pycache__ -prune -exec rm -rf {} +
          tar czf Companion-Sync-Pi.tar.gz -C pkg companion-sync
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-Sync-Pi
          path: Companion-Sync-Pi.tar.gz

  # Publish each build from main as the latest release: the app's
  # "Update Companion Sync" menu item downloads and installs it from here.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, mac, pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/Companion-Sync-Windows/Companion Sync.exe" Companion-Sync-Windows.exe
          cp out/Companion-Sync-Windows/Companion-Sync-Setup.exe Companion-Sync-Setup.exe
          cp out/Companion-Sync-Mac/Companion-Sync-Mac.zip Companion-Sync-Mac.zip
          cp out/Companion-Sync-Pi/Companion-Sync-Pi.tar.gz Companion-Sync-Pi.tar.gz
          gh release create "build-${{ github.run_number }}" \
            Companion-Sync-Setup.exe Companion-Sync-Windows.exe Companion-Sync-Mac.zip Companion-Sync-Pi.tar.gz \
            --repo "${{ github.repository }}" --latest \
            --title "Companion Sync v$(cat VERSION) (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}"
